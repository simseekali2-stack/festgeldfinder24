<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Shield Icon Container -->
  <g transform="translate(10, 5)">
    <path d="M25 2 C 35 7, 45 7, 48 10 C 48 28, 42 42, 25 48 C 8 42, 2 28, 2 10 C 5 7, 15 7, 25 2 Z" fill="url(#shieldGrad)" />
    <!-- Trend Arrow / Check -->
    <path d="M12 25 L 20 33 L 36 15" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Gold Euro Coin Badge -->
    <circle cx="36" cy="36" r="9" fill="url(#goldGrad)" stroke="#064E3B" stroke-width="1.5" />
    <text x="36" y="40" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#064E3B" text-anchor="middle">€</text>
  </g>

  <!-- Brand Typography for Light Backgrounds -->
  <text x="70" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
    Festgeld<tspan fill="#059669">Finder</tspan><tspan fill="#D97706">24</tspan>
  </text>
  <text x="71" y="48" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">
    DEUTSCHLANDS ZINSVERGLEICH #1
  </text>
</svg>
